name: Deploy Function App

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'infra/**'
      - '.github/workflows/ci-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Flex Consumption
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile infrastructure
        run: bicep build infra/main.bicep --outfile infra/main.json

      - name: Create deployment package
        working-directory: src
        run: zip -r ../function-app.zip . -x 'local.settings.json' '*.DS_Store'

      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure incrementally
        uses: Azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/main.json
          parameters: >
            uniqueSuffix=${{ secrets.AZURE_UNIQUE_SUFFIX }}
            githubBranch=${{ github.ref_name }}
            githubOwner=${{ github.repository_owner }}
            githubRepository=${{ github.event.repository.name }}
            keyVaultSecretsEnabled=false
          deploymentMode: Incremental
          deploymentName: SpotifyExporter-main
          failOnStdErr: false

      - name: Deploy Function App package
        uses: Azure/functions-action@bc63708cc6539760eea18d8a7de4ce8ef5fdf593 # v1.5.6
        with:
          app-name: func-spotifyexp-${{ secrets.AZURE_UNIQUE_SUFFIX }}
          package: function-app.zip
          sku: flexconsumption
